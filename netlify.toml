# Lumière Jewels. Static publish dir at repo root: zero build, zero bundler,
# hand-written HTML so the first byte is the content (see the SEO/perf rules).
# Deploy: point Netlify at this repo. Publish directory: the repo root.
# Done. (Rate limiting + form spam protection: enable in Netlify UI >
# Site configuration if you want more than the built-in form defenses.)

[build]
  # The composer runs at deploy time (zero dependencies, plain Node), so the
  # fingerprinted asset URLs below are generated even when main was edited
  # from the GitHub web UI with no local build available.
  command = "node tools/build.mjs"
  publish = "."

# Default to a production-style environment if a build is ever attached.
[build.environment]
  NODE_VERSION = "20"

# HTTPS is enforced automatically by Netlify (hardening #19); HSTS below
# is the site's own half of the bargain.

# Custom branded 404 (fixes checklist #14, anti-vibe #1).
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Security headers (hardening #18). No inline scripts/styles are used
# anywhere, so the CSP can stay strict with no inline escape hatch.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self';
      style-src 'self';
      img-src 'self' https://ik.imagekit.io https://*.google-analytics.com;
      font-src 'self';
      connect-src 'self' https://*.google-analytics.com https://analytics.google.com;
      manifest-src 'self';
      frame-src https://www.openstreetmap.org;
      frame-ancestors 'none';
      base-uri 'self';
      form-action 'self';
      object-src 'none';
      upgrade-insecure-requests"""
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

# Caching strategy, the textbook version. CSS/JS URLs carry a content hash
# (see tools/build.mjs): when the file changes, the URL changes, so these can
# be cached for a year, immutable, and can never go stale. Fonts and images
# keep unversioned URLs, so they get an honest week. The search index holds
# build output, so it revalidates like HTML does by default.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
